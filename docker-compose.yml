services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripcopilot
    ports:
      - "5432:5432"
    volumes:
      - tripcopilot-postgres:/var/lib/postgresql/data

volumes:
  tripcopilot-postgres:
